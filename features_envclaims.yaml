# features_envclaims.yaml — construct audit, replication on Stammbach et al. (2023)
# Environmental claims (label 1 = environmental claim, 0 = not).
# Every rule below is taken from a rationale in the paper's Appendix B, Tables 4-5.
# No rule is added that the authors' rationales do not state.
# Commit this file BEFORE generating any variants.

meta:
  version: "envclaims-v1"
  codebook: "Stammbach et al. (2023), Appendix B + Tables 4-5"
  padding_mode: "clause"        # model is sentence-level: neutral text goes INSIDE the sentence
  date_written: "2026-10-15"
  author: "Jemin"

features:

  - name: stated_impact
    type: relevant
    source: "Table 5, AUSEA row: 'Product with potentially positive environmental impact, but impact is not stated hence no claim'"
    codebook_rule: >
      A product, service or process is a claim only if its positive environmental impact
      is stated in the sentence.
    seed_requirements: >
      Label 0: describes a product/service/process with obvious environmental relevance but
      states no impact. Label 1: a product/service/process sentence whose ONLY claim element
      is an explicit statement of positive environmental impact.
    edit_instruction_by_label:
      "0": >
        Add one short clause stating that the product, service or process has a positive
        environmental effect (for example, that it reduces emissions or pollution). Do not
        add numbers, targets, labels or certifications. Keep every other word.
      "1": >
        Remove only the words that state the positive environmental effect, so the sentence
        still describes the product, service or process but no longer says it benefits the
        environment. Keep every other word.
    expected:
      "0": 1
      "1": 0
    generated_by: llm

  - name: sustainability_wording
    type: relevant
    source: >
      Table 4, 'Our places' row, including the authors' own counterfactual: 'No would be:
      "Our places, which are designed to become part of local communities, provide
      opportunities for skills development and employment and promote wellbeing."'
    codebook_rule: >
      Generic sustainability or responsibility wording about the firm's products, places or
      conduct makes the sentence a claim, because 'sustainability' includes environmental aspects.
    seed_requirements: >
      Label 1: the ONLY claim element is generic sustainability/responsibility wording.
      Label 0: describes the firm's products, places or conduct with no environmental or
      sustainability wording at all.
    edit_instruction_by_label:
      "1": >
        Remove only the generic sustainability or responsibility wording, the way 'designed to
        meet high sustainability standards' becomes 'designed to' in this example:
        'Our places, which are designed to meet high sustainability standards, become part of
        local communities' -> 'Our places, which are designed to become part of local communities'.
        Keep every other word.
      "0": >
        Insert a short generic sustainability phrase describing the firm's products, places or
        conduct, the way 'designed to become' becomes 'designed to meet high sustainability
        standards, become' in this example: 'Our places, which are designed to become part of
        local communities' -> 'Our places, which are designed to meet high sustainability
        standards, become part of local communities'. Keep every other word.
    expected:
      "1": 0
      "0": 1
    generated_by: llm

  - name: commitment_to_act
    type: relevant
    source: "Table 5, three rows: 'environmental risk exposure description but no commitment / claim to act on reducing the risk or improving impact'"
    codebook_rule: >
      Describing environmental risk or exposure is not a claim; committing to act to reduce
      the risk or improve the impact is.
    seed_requirements: >
      Label 0: describes environmental risk, emissions sources or exposure with no commitment.
      Label 1: the ONLY claim element is a commitment to reduce such a risk or impact.
    edit_instruction_by_label:
      "0": >
        Add one short clause in which the company commits to reducing this risk or impact
        (for example, 'which we are working to reduce'). Do not add numbers or targets.
        Keep every other word.
      "1": >
        Remove only the commitment to reduce the risk or impact, so the sentence only
        describes the risk or exposure. Keep every other word.
    expected:
      "0": 1
      "1": 0
    generated_by: llm

  - name: padding
    type: irrelevant
    source: "Appendix B, bullet 2: 'Base your decision on the information that is available within the sentence'"
    codebook_rule: >
      A neutral clause that adds no environmental information cannot change the label.
    edit_instruction: "Insert one clause from padding_bank before the final punctuation."
    expected: {"0": 0, "1": 1}
    generated_by: script

  - name: placebo
    type: control
    codebook_rule: "No construct-relevant change."
    edit_instruction: >
      Replace 1-3 words with exact synonyms. Do not touch any word about the environment,
      sustainability, impact, emissions, products' effects, or commitments. Do not change
      meaning or tone.
    expected: {"0": 0, "1": 1}
    generated_by: llm

# Neutral clauses inserted before the sentence's final punctuation.
# Rules: no environmental, sustainability, performance or commitment content.
padding_bank:
  - "as described in the previous section"
  - "for the period under review"
  - "as outlined elsewhere in this report"
  - "in line with the structure of this report"
  - "as presented in the table below"
